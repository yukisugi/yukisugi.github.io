<header id="header">
  <div id="header_logo">
    <a href="{{ '/' | relative_url }}">
      <span class="header_logo_ja">{{ site.title }}</span>
      <span class="header_logo_en">Yukihiko SUGITA, {{ site.name_credentials }}</span>
    </a>
  </div>
  <nav id="menu_head">
    <ul>
      {% for item in site.data.nav %}
      {% unless forloop.first %}<li class="menu_divider"></li>{% endunless %}
      <li><a href="{{ item.url | relative_url }}">{{ item.title }}</a></li>
      {% endfor %}
    </ul>
  </nav>
</header>
